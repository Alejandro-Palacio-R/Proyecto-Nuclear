spring.application.name=psicoapp
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/psicoapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${APP_JWT_SECRET:psicoapp-secret-key-change-this-in-production-psicoapp-secret-key}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:720}
server.port=${SERVER_PORT:8080}
